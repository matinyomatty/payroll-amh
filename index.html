<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AMH Payroll Autobot</title>
<script>
  /* ▼ Paste your Google web app link between the quotes (Deploy → Manage deployments → Web app URL) */
  const WEB_APP_URL = "PASTE-YOUR-WEB-APP-URL-HERE";
  if (WEB_APP_URL.startsWith("https://script.google.com/")) location.replace(WEB_APP_URL);
</script>
<style>
  body{margin:0;font:16px/1.5 "Segoe UI",system-ui,sans-serif;background:#eef2f0;color:#15241f;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
  .card{background:#fff;border:1px solid #d5dfda;border-radius:12px;padding:28px;max-width:440px;width:100%}
  small{color:#0d6b5a;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.72rem}
  h1{margin:.2em 0 .4em;font-size:1.5rem}
  a.btn{display:inline-block;background:#0d6b5a;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-weight:600}
  p{color:#5b6b65}
  @media (prefers-color-scheme:dark){body{background:#0f1714;color:#e3ece8}.card{background:#16211d;border-color:#2a3a34}p{color:#95a8a0}a.btn{background:#4cc3a6;color:#06231c}small{color:#4cc3a6}}
</style>
</head>
<body>
  <div class="card">
    <small>NSK Hospitals · AMH-Pemba</small>
    <h1>Payroll Autobot</h1>
    <p id="msg">Opening the app… Sign in with your NSK Google account if asked.</p>
    <a class="btn" id="go" href="#">Open Payroll Autobot</a>
  </div>
<script>
  const ok = WEB_APP_URL.startsWith("https://script.google.com/");
  document.getElementById("go").href = ok ? WEB_APP_URL : "#";
  if (!ok) document.getElementById("msg").textContent = "The app link hasn't been added yet. Admin: edit index.html and paste the Google web app URL.";
</script>
</body>
</html>
